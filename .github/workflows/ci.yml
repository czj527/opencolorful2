name: ci

# 唯一必需的 workflow（t3 §3）：Node 22，顺序 install → lint → typecheck → test
# → （token 门禁调用位）→ build → ratchet。
# 只跑"源码上的确定性门禁"；真实发布产物的端到端验收归 t7 本地流程（t7 §5）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint → typecheck → test → build → ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 —— verify-release 需要 tag 与提交历史（真实发布校验在本地/tag 流程执行）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      # t5 门禁调用位（预留，t3 §6-5）：scripts/check-tokens.mjs 本体由 t5 落地
      # （解析 token 源文件复核对比度 + 引用完整性，与 pnpm test 同级门禁）。
      # 脚本存在即在本顺序位成为硬门禁；尚未落地时显式 PENDING，**不静默通过**。
      - name: check:tokens（t5 预留调用位）
        run: |
          if [ -f scripts/check-tokens.mjs ]; then
            node scripts/check-tokens.mjs
          else
            echo "::warning title=token 门禁 PENDING::scripts/check-tokens.mjs 尚未落地（owner: t5）——本步骤当前不构成门禁（t3 §6-5）"
          fi

      - name: build
        run: pnpm build

      # 反假绿（t7 FG-01/FG-02）：构建必须真的产出可运行文件，而不是"dev server 能跑"。
      - name: build artifacts（产物存在性断言）
        run: |
          for artifact in \
            packages/agent-core/dist/index.js \
            packages/state/dist/index.js \
            packages/gateway-protocol/dist/index.js \
            packages/plugin-sdk/dist/index.js \
            apps/desktop/dist/main/main.cjs \
            apps/desktop/dist/main/preload.cjs \
            apps/desktop/dist/renderer/index.html \
            apps/desktop/dist/renderer/main.js \
            apps/desktop/dist/renderer/styles/tokens.css \
            apps/desktop/dist/build-info.json ; do
            if [ ! -f "$artifact" ]; then
              echo "缺少构建产物：$artifact（t7 FG-01/FG-02）"
              exit 1
            fi
          done

      # 版本戳注入机制（t3 §6-6）：根 package.json 为单一版本源，apps/desktop 必须一致。
      - name: version check（版本戳单一来源一致）
        run: pnpm version:check

      - name: check:ratchet
        run: pnpm check:ratchet

      # verify-release 脚本自检（CI 无桌面打包产物，故只做语法检查 + fixture 自检；
      # 真实目录校验 = node scripts/verify-release.mjs dist/release/<version>，留 t7 本地验收）。
      - name: verify-release（node --check + --self-test）
        run: |
          node --check scripts/verify-release.mjs
          node --check scripts/check-ratchet.mjs
          node --check scripts/sync-version.mjs
          node --check apps/desktop/scripts/gen-build-info.mjs
          node --check apps/desktop/scripts/copy-assets.mjs
          node scripts/verify-release.mjs --self-test
